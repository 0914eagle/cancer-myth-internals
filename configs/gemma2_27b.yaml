# Gemma-2-27B-it: Cancer-Myth Table 3 top row (PCR 17.3), Gemma Scope SAEs,
# Activation Oracle checkpoint. 54GB in bfloat16 -> three 24GB cards. No
# quantization: it changes activation values (medical_nla NOTES, same rule).
# Run with CUDA_VISIBLE_DEVICES=1,2,3 after the single-card jobs finish.
_base: default.yaml
source_model:
  model_id: google/gemma-2-27b-it
  short_name: gemma2_27b
  dtype: bfloat16
  device_map: auto
  max_memory:
    0: 22GiB
    1: 22GiB
    2: 22GiB
  trust_remote_code: false
  n_layers: 46
  d_model: 4608
activation:
  position_mode: last_token
  target_text_strategy: last_subtoken
  target_text_occurrence: 0
  batch_size: 2
  layers: all
generation:
  do_sample: false
  temperature: null
  top_p: null
  max_new_tokens: 512
  batch_size: 2
