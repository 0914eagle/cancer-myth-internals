# Gemma-3-12B-it: the medical_nla backbone, with the released NLA L32 pair
# (kitft/nla-gemma3-12b-L32-{av,ar}). Activations written by this repo use the
# same manifest layout as medical_nla, so its src.run_nla and
# score_reconstruction_mse.py read them directly. 24.4GB bf16 -> two cards.
_base: default.yaml
source_model:
  model_id: google/gemma-3-12b-it
  short_name: gemma3_12b
  dtype: bfloat16
  device_map: auto
  max_memory:
    0: 22GiB
    1: 22GiB
  trust_remote_code: true
  n_layers: 48
  d_model: 3840
activation:
  position_mode: last_token
  target_text_strategy: last_subtoken
  target_text_occurrence: 0
  batch_size: 4
  layers: all
generation:
  do_sample: false
  temperature: null
  top_p: null
  max_new_tokens: 512
  batch_size: 4
